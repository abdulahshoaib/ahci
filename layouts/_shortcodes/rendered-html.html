{{- $html := .Inner -}}
{{- $template := `<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 1rem;
      color: #f2f2f2;
      background: #111;
      font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: #8ec5ff; display: inline-block; margin: 0.15rem 0.35rem 0.15rem 0; }
    button,
    input,
    select {
      font: inherit;
      margin: 0.25rem;
    }
    button,
    .button,
    .primary-button,
    .touch-target {
      border: 1px solid #8ec5ff;
      border-radius: 0.35rem;
      background: #1f6fb2;
      color: #fff;
      display: inline-block;
      padding: 0.55rem 0.8rem;
      text-decoration: none;
    }
    .secondary { background: #333; }
    .danger { background: #a91b1b; border-color: #ff8a8a; }
    .service-grid {
      display: grid;
      gap: 0.5rem;
      grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    }
    .service-grid a,
    section a {
      border: 1px solid #333;
      border-radius: 0.35rem;
      padding: 0.45rem 0.6rem;
    }
    .huge-logo { font-size: clamp(3rem, 16vw, 7rem); line-height: 0.9; }
    .abstract-graphics {
      border: 1px dashed #777;
      margin: 1rem 0;
      min-height: 7rem;
      padding: 1rem;
    }
    .collage-layout {
      min-height: 12rem;
      position: relative;
    }
    .rotated-text {
      position: absolute;
      transform: rotate(-90deg);
      transform-origin: left top;
    }
    .floating-note {
      left: 35%;
      position: absolute;
      top: 45%;
    }
    .hidden-link {
      opacity: 0.35;
      position: absolute;
      right: 1rem;
      top: 1rem;
    }
    .overlay {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
    }
    .mobile-nav a,
    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }
    form,
    fieldset {
      display: grid;
      gap: 0.45rem;
      max-width: 24rem;
    }
    img {
      background: #333;
      border: 1px solid #555;
      min-height: 6rem;
      max-width: 100%;
    }
  </style>
</head>
<body>
__RENDERED_HTML__
</body>
</html>` -}}
{{- $document := replace $template "__RENDERED_HTML__" $html -}}
<div class="rendered-html-example">
  <iframe sandbox="" loading="lazy" referrerpolicy="no-referrer" srcdoc="{{ $document | safeHTMLAttr }}"></iframe>
</div>
